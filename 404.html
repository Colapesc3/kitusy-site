<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagina non trovata — Kitusy</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/kitusy-kite.svg">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
*{box-sizing:border-box}
body{margin:0}
:root{
  --navy:#0B2A4A; --navy-2:#0F3560; --line:#24507d;
  --ink:#FFFFFF; --muted:#A9C1DA;
  --k-blue:#1F5FAF; --k-cyan:#26A9C9; --k-green:#4CAF7A; --k-amber:#F2A541; --k-red:#E4572E;
  --f-display:"Lexend","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --s0:1rem; --s1:1.618rem; --s2:2.618rem; --s3:4.236rem;
  color-scheme:dark;
}
html{background:var(--navy)}
body{background:var(--navy);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.65}
.wrap{max-width:44rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--k-cyan)}
a:focus-visible{outline:2px solid var(--k-amber);outline-offset:3px;border-radius:4px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s0);padding-block:.7rem;max-width:68rem}
.brand{display:flex;align-items:center;gap:.6rem;color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:1.25rem}
.brand img{width:1.75rem;height:auto;display:block}
header nav a{color:var(--muted);text-decoration:none;font-size:.95rem}
header nav a:hover{color:var(--ink)}
main .wrap{padding-block:var(--s2) var(--s3)}
.eyebrow{font:600 .75rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--k-amber);margin:0 0 .4rem}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.2;margin:0 0 .4rem;text-wrap:balance}
.updated{color:var(--muted);font-size:.95rem;margin:0 0 var(--s1)}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:var(--s1) 0 .4rem}
p{margin:0 0 var(--s0)}
ul{margin:0 0 var(--s0);padding-left:1.3rem}
li{margin-bottom:.3rem}
.stripe{display:flex;height:4px;max-width:12rem;margin:0 0 var(--s1);border-radius:2px;overflow:hidden}
.stripe i{flex:1}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:var(--s0) var(--s1);margin:0 0 var(--s1)}
.card p{margin:0 0 .3rem}
.card p:last-child{margin:0}
hr{border:0;border-top:1px solid var(--line);margin:var(--s3) 0 var(--s2)}
footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:var(--s0);flex-wrap:wrap;padding-block:var(--s1);color:var(--muted);font-size:.85rem;max-width:68rem}
footer a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/" aria-label="Kitusy, pagina principale"><img src="/assets/kitusy-kite.svg" alt=""><span>Kitusy</span></a>
  </div>
</header>
<main>
  <div class="wrap" style="text-align:center">
    <img src="/assets/kitusy-kite.svg" alt="" style="width:6rem;height:auto;margin:0 auto var(--s1);display:block">
    <h1>Questa pagina è volata via</h1>
    <p class="updated">L'indirizzo che hai aperto non esiste o è stato spostato. · This page doesn't exist or has moved.</p>
    <p><a href="/">Torna a kitusy.com</a></p>
  </div>
</main>
<footer>
  <div class="wrap">
    <span>© 2026 Kitusy</span>
    <a href="/privacy">Privacy del sito</a>
  </div>
</footer>
</body>
</html>
